form.membershipRenewal.declaration3=se seznámil/a se způsobem zpracování mých osobních údajů KNAV v rozsahu a v souladu s účelem uvedeným v <a href="https://www.lib.cas.cz/o-knihovne/knihovni-rad/#kr29" target="_blank" rel="noopener">knihovním řádu<span class="sr-only"> (otevře se v novém okně)</span></a> a v <a href="https://lib.cas.cz/wp-content/uploads/2024/11/Komplet_Bank-iD_cze.pdf" target="_blank" rel="noopener">informaci o zpracování osobních údajů<span class="sr-only"> (otevře se v novém okně)</span></a>.
form.membershipRenewal.declaration4.intro=A zavazuji se:
form.membershipRenewal.declaration4=ve lhůtě splatnosti uhradit registrační poplatek přes platební bránu, nebo poukazem na registraci.
# Pages
page.home.heading1=Registrace Komplet
page.home.heading2=Online prostřednictvím Bank&nbsp;iD
page.home.description1=Ověřte svou totožnost prostřednictvím Bank&nbsp;iD předáním údajů:<br><strong>jméno</strong> a <strong>příjmení</strong>, <strong>datum narození</strong> a <strong>adresa v České republice</strong>.
page.home.heading3=Registrace
page.home.description2=Po ověření totožnosti:
page.home.description2.ol=<li>vyplňte a odešlete registrační formulář,</li><li>nastavte heslo ke svému uživatelskému kontu,</li><li>uhraďte <a href="https://lib.cas.cz/o-knihovne/knihovni-rad/#5-1-registrace" target="_blank" rel="noopener">registrační poplatek<span class="sr-only"> (otevře se v novém okně)</span></a> prostřednictvím platební brány.</li>
page.home.description3=Před registrací se seznamte s <a href="https://lib.cas.cz/o-knihovne/knihovni-rad/" target="_blank" rel="noopener">knihovním řádem<span class="sr-only"> (otevře se v novém okně)</span></a> a způsobem <a href="https://lib.cas.cz/wp-content/uploads/2024/11/Komplet_Bank-iD_cze.pdf" target="_blank" rel="noopener">zpracování osobních údajů<span class="sr-only"> (otevře se v novém okně)</span></a>. Platnost registrace je 1&nbsp;rok. <strong>Naše služby můžete začít využívat bezprostředně po připsání platby na náš účet.</strong>
page.home.heading4=Obnovení registrace
page.home.description4=Po ověření totožnosti:
page.home.description4.ol=<li>aktualizujte své osobní údaje a odešlete registrační formulář,</li><li>uhraďte <a href="https://lib.cas.cz/o-knihovne/knihovni-rad/#5-1-registrace" target="_blank" rel="noopener">registrační poplatek<span class="sr-only"> (otevře se v novém okně)</span></a> prostřednictvím platební brány.</li>
page.home.description5=Před obnovením registrace se seznamte s <a href="https://lib.cas.cz/o-knihovne/knihovni-rad/" target="_blank" rel="noopener">knihovním řádem<span class="sr-only"> (otevře se v novém okně)</span></a> a způsobem <a href="https://lib.cas.cz/wp-content/uploads/2024/11/Komplet_Bank-iD_cze.pdf" target="_blank" rel="noopener">zpracování osobních údajů<span class="sr-only"> (otevře se v novém okně)</span></a>. <strong>Možnost využívat služby knihovny je v době mezi odesláním formuláře a úhradou poplatku dočasně pozastavena.</strong> Platnost obnovené registrace je 1&nbsp;rok. Přihlašovací údaje se obnovením registrace nemění.
page.home.heading5=Uplatnění jednoúčelového poukazu na registraci
page.home.description6=Při registraci po odeslání registračního formuláře nastavte heslo a zadejte kód poukazu. Při obnovení registrace zadejte kód poukazu přímo v registračním formuláři. Poplatek bude uhrazen tímto kódem bez nutnosti platby. Kód poukazu můžete zadat i na stránkách úhrady, před vstupem na platební bránu (před stisknutím tlačítka “Uhradit registrační poplatek”).
page.home.heading6=Pracovníky AV ČR registrujeme zdarma
page.home.description7=Status pracovníka AV ČR doložte uvedením pracovního e-mailu, nebo přiložením služebního průkazu či <a href="https://www.lib.cas.cz/wp-content/uploads/ppvztah_new.pdf" target="_blank" rel="noopener">potvrzení od pracoviště AV ČR<span class="sr-only"> (otevře se v novém okně)</span></a> k registračnímu formuláři. Registraci můžete začít využívat bezprostředně po nastavení hesla, obnovenou registraci po aktualizaci osobních údajů. Registrace/obnovená registrace je platná 3 roky.
page.home.comgateText=Online platby pro nás zajišťuje platební brána Comgate. Poskytovatel služby, společnost Comgate a.s. je licencovaná Platební instituce působící pod dohledem České národní banky. Platby probíhající skrze platební bránu jsou plně zabezpečeny a veškeré informace jsou šifrovány. Další informace a kontakty na <a href="https://www.comgate.cz" target="_blank" rel="noopener">www.comgate.cz<span class="sr-only"> (otevře se v novém okně)</span></a>.
