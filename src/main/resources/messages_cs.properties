page.bankidCbError.accessDeniedAuthentication.description=Na přihlašovací obrazovce Bank iD bylo přihlášení zrušeno. Pokud chcete pokračovat, spusťte prosím ověření znovu.
page.bankidCbError.accessDeniedConsent.title=Nebyl udělen souhlas s předáním údajů
page.bankidCbError.accessDeniedConsent.description=Bez souhlasu s předáním údajů nemůžeme pokračovat v registraci ani v obnovení registrace. Pokud chcete pokračovat, spusťte prosím ověření znovu a potvrďte souhlas.
page.bankidCbError.eidDoesntExist.title=Bank iD není pro tento účet k dispozici
page.bankidCbError.eidDoesntExist.description=Vaše banka uvedla, že pro tento účet nelze Bank iD použít. Obraťte se prosím na svou banku nebo využijte jiný způsob registrace.
page.bankidCbError.eidDoesntExistNotEligible.title=Bank iD není pro tento účet k dispozici
page.bankidCbError.eidDoesntExistNotEligible.description=Vaše banka uvedla, že pro tento účet nejste způsobilý/á používat Bank iD. Obraťte se prosím na svou banku nebo využijte jiný způsob registrace.
page.bankidCbError.eidDoesntExistDisabledAuthentication.title=Bank iD je pro tento účet vypnuta
page.bankidCbError.eidDoesntExistDisabledAuthentication.description=Vaše banka uvedla, že pro tento účet nelze Bank iD použít, například protože je služba vypnuta. Obraťte se prosím na svou banku nebo využijte jiný způsob registrace.
page.bankidCbError.userNotEligible.title=Ověření Bank iD nelze dokončit
page.bankidCbError.userNotEligible.description=Poskytovatel Bank iD uvedl, že pro tento účet není možné v tomto ověření pokračovat. Zkuste prosím jiný způsob registrace nebo se obraťte na svou banku.
page.bankidCbError.userNotEligibleMethodInsufficient.title=Zvolený způsob ověření nestačí
page.bankidCbError.userNotEligibleMethodInsufficient.description=Poskytovatel Bank iD uvedl, že pro tento typ služby není k dispozici dostatečně bezpečný způsob ověření. Zkuste prosím jiný způsob ověření u své banky nebo jiný způsob registrace.
page.bankidCbError.userNotEligibleDataOrAge.title=Nelze pokračovat kvůli omezení účtu
page.bankidCbError.userNotEligibleDataOrAge.description=Poskytovatel Bank iD uvedl, že chybí povinné údaje nebo věk neumožňuje tuto službu použít. Ověřte si prosím údaje u své banky nebo využijte jiný způsob registrace.
page.bankidCbError.invalidGrant.title=Platnost přihlášení přes Bank iD vypršela
page.bankidCbError.invalidGrant.description=Odkaz pro dokončení ověření už nelze použít. To se může stát po obnovení staré stránky, návratu tlačítkem zpět nebo po delší nečinnosti. Spusťte prosím ověření znovu.
