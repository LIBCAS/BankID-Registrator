form.newRegistration.section1.title=ZÁKLADNÍ IDENTIFIKAČNÍ ÚDAJE
form.newRegistration.section1.subtitle=Právní základ: plnění smlouvy
form.newRegistration.section1.text1=Všechny tyto údaje slouží k uzavření smlouvy. Bez jejich předání vás nebudeme moci zaregistrovat prostřednictvím Bank iD, můžete ale využít <a href="https://lib.cas.cz/sluzby/registrace/" target="_blank" rel="noopener">jiný způsob registrace<span class="sr-only"> (otevře se v novém okně)</span></a>.
form.newRegistration.section2.title=KONTAKTNÍ ÚDAJE
form.newRegistration.section2.subtitle=Právní základ: plnění smlouvy
form.newRegistration.section2.text1=<strong>Na e-mail Vám pošleme základní informace k registraci, našim službám a uživatelskému kontu</strong>. Informace k uživatelskému kontu Vám zobrazíme také po odeslání registračního formuláře, takže Vám budou <strong>jednorázově</strong> k dispozici i bez poskytnutí e-mailu. Zároveň e-mailem zasíláme zprávy týkající se služeb a registrace (termín vyzvednutí a vrácení knížek, konce registrace, nájmu individuální studovny nebo třeba informace o automatickém prodlužování výpůjční lhůty).
form.newRegistration.section2.text2=Telefon využíváme především v případech, kdy si zapomenete své věci ve studovně nebo šatně, protože je to nejrychlejší cesta, jak Vás na tuto situaci upozornit. Zároveň jej a kontaktní adresu využíváme pro dosažení mimosoudního vyrovnání nesplněných závazků. Je jen na Vás, zda nám tyto údaje poskytnete, proto je můžete volně přidávat, upravovat a mazat ve svém uživatelském kontu.
form.newRegistration.section3.title=REGISTRACE ČTENÁŘSKÉHO PRŮKAZU
form.newRegistration.section3.intro=Pokud během registrace chcete navštěvovat naši studovnu a/nebo si půjčovat tištěné knihy domů, <strong>můžete</strong> už teď připojit identifikátor své čipové karty, kterou budete používat jako čtenářský průkaz.
form.newRegistration.section3.subtitle=ČTENÁŘSKÝ PRŮKAZ (identifikátor MIFARE RFID tagu karty)
form.newRegistration.section3.accordionBtn.show=Zobrazit instrukce
form.newRegistration.section3.accordionBtn.hide=Skrýt instrukce
form.newRegistration.section3.accordionBtn.aria=Instrukce pro registraci čtenářského průkazu
form.newRegistration.section3.block1.h=Právní základ: plnění smlouvy
form.newRegistration.section3.block1.text1=Do pole “Hodnota identifikátoru” opište řetězec, který zjistíte v mobilní aplikaci. Po dokončení registrace pak můžete bez nutnosti dalších kroků začít svou kartu ihned používat jako čtenářský průkaz.
form.newRegistration.section3.block1.text2=Připojit můžete svou platnou bankovní kartu s čipem a bezkontaktní technologií, nebo svou čipovou kartu třetí strany se jménem a příjmením (např.: karta ISIC, Lítačka, INkarta Českých drah apod.). Registrovat ji můžete také později u pracovníků registračního pultu ve studovně. Pokud takovou kartu nemáte, nebo nechcete použít, můžete si za <a href="https://lib.cas.cz/o-knihovne/knihovni-rad/#5-1-registrace" target="_blank" rel="noopener">poplatek<span class="sr-only"> (otevře se v novém okně)</span></a> nechat ve studovně vystavit čtenářský průkaz KNAV.
form.newRegistration.section3.block1.text3=<strong>Čtenářský průkaz nebudete potřebovat, pokud chcete využívat pouze služby dostupné prostřednictvím vzdáleného přístupu.</strong>
form.newRegistration.section3.block2.h=Android
form.newRegistration.section3.block2.text=Na telefonu s operačním systémem Android a s NFC technologií zjistíte řetězec například nástrojem <a href="https://play.google.com/store/apps/details?id=de.syss.MifareClassicTool&hl=en_US" target="_blank" rel="noopener">MIFARE Classic Tool<span class="sr-only"> (otevře se v novém okně)</span></a>. Po instalaci a spuštění aplikace přiložte telefon ke kartě a do formuláře opište hodnotu UID (řetězec může vypadat takto <strong>08D4EED6</strong>, ale může být i delší, či kratší). Hlášku „Not a MIFARE Classic tag!“ ignorujte.
form.newRegistration.section3.block3.h=iOS
form.newRegistration.section3.block3.text=Na telefonu s operačním systémem iOS použijte například aplikaci <a href="https://apps.apple.com/us/app/nfc-tools/id1252962749" target="_blank" rel="noopener">NFC Tools<span class="sr-only"> (otevře se v novém okně)</span></a>. Po instalaci a spuštění aplikace přiložte telefon ke kartě a do formuláře opište hodnotu z pole “Serial number” označenou ikonou klíče. Při opisování řetězce vynechte dvojtečky (řetězec zobrazený 04:F4:F6:2A:9E:4A:80 opište takto: <strong>04F4F62A9E4A80</strong>).
form.newRegistration.section4.title=ZVÝHODNĚNÁ REGISTRACE PRO PRACOVNÍKY AV ČR
form.newRegistration.section4.text1=Doložte svůj pracovněprávní vztah k AV ČR a my Vám poskytneme registraci <a href="https://lib.cas.cz/sluzby/registrace/registrace-komplet/" target="_blank" rel="noopener">Komplet<span class="sr-only"> (otevře se v novém okně)</span></a> na 3 roky bez poplatku. Stačí, když v tomto formuláři vyplníte svou pracovní e-mailovou adresu (s doménou pracoviště AV ČR). Pokud ji nemáte, přiložte kopii služebního průkazu nebo vyplněného <a href="https://lib.cas.cz/wp-content/uploads/ppvztah_new.pdf" target="_blank" rel="noopener">potvrzení<span class="sr-only"> (otevře se v novém okně)</span></a>. Bez ověření pracovněprávního vztahu k AV ČR Vám zvýhodněnou registraci nemůžeme poskytnout.
form.newRegistration.declaration1.intro=Prohlašuji, že jsem:
form.newRegistration.declaration1=se seznámil/a s knihovním řádem zveřejněným na <a href="https://www.lib.cas.cz/o-knihovne/knihovni-rad/" target="_blank" rel="noopener">https://www.lib.cas.cz/o-knihovne/knihovni-rad/<span class="sr-only"> (otevře se v novém okně)</span></a>, zavazuji se jej dodržovat a po dobu platnosti mé registrace se seznámit s každou jeho novou verzí zveřejněnou na webových stránkách KNAV,
form.newRegistration.declaration2=zkontroloval/a správnost a úplnost mých osobních údajů uvedených v tomto registračním formuláři,
form.newRegistration.declaration3=se seznámil/a se způsobem zpracování mých osobních údajů KNAV v rozsahu a v souladu s účelem uvedeným v <a href="https://www.lib.cas.cz/o-knihovne/knihovni-rad/#kr29" target="_blank" rel="noopener">knihovním řádu<span class="sr-only"> (otevře se v novém okně)</span></a> a v <a href="https://lib.cas.cz/wp-content/uploads/2024/11/Komplet_Bank-iD_cze.pdf" target="_blank" rel="noopener">informaci o zpracování osobních údajů<span class="sr-only"> (otevře se v novém okně)</span></a>.
form.newRegistration.declaration4.intro=A zavazuji se:
form.newRegistration.declaration4=ve lhůtě splatnosti uhradit registrační poplatek přes platební bránu, nebo poukazem na registraci.
form.membershipRenewal.section1.title=ZÁKLADNÍ IDENTIFIKAČNÍ ÚDAJE
form.membershipRenewal.section1.subtitle=Právní základ: plnění smlouvy
form.membershipRenewal.section1.text1=Všechny tyto údaje slouží k obnovení smlouvy a bez jejich předání Vám nebudeme moci registraci prostřednictvím Bank iD obnovit. Můžete ale využít <a href="https://lib.cas.cz/sluzby/registrace/" target="_blank" rel="noopener">jiný způsob obnovení registrace<span class="sr-only"> (otevře se v novém okně)</span></a>.
form.membershipRenewal.section2.title=KONTAKTNÍ ÚDAJE
form.membershipRenewal.section2.subtitle=Právní základ: plnění smlouvy
form.membershipRenewal.section2.text1=Kontaktní údaje používáme k informování o službách a registraci, je tedy jen na Vás, zda nám je poskytnete. Tyto údaje můžete volně přidávat, upravovat a mazat také ve svém uživatelském kontu.
form.membershipRenewal.section3.title=REGISTRACE ČTENÁŘSKÉHO PRŮKAZU
form.membershipRenewal.section3.intro=<strong>Váš registrovaný čtenářský průkaz zůstane platný i po obnovení registrace</strong>. Pokud ho nemáte, nebo chcete změnit, <strong>můžete</strong> připojit identifikátor své čipové karty, kterou chcete po obnovení jako čtenářský průkaz začít používat.
form.membershipRenewal.section3.subtitle=ČTENÁŘSKÝ PRŮKAZ (identifikátor MIFARE RFID tagu karty)
