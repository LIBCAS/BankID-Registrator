page.bankidCbError.accessDenied.title=Přihlášení přes Bank iD bylo zrušeno
page.bankidCbError.accessDenied.description=Bank iD vrátila odpověď access_denied. Pokud chcete pokračovat, spusťte prosím ověření znovu.
