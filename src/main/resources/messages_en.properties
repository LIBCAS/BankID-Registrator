form.newRegistration.section1.title=BASIC IDENTIFICATION DATA
form.newRegistration.section1.subtitle=Legal basis: fulfillment of the contract
form.newRegistration.section1.text1=All these data serve to conclude the contract. Without their transfer, we will not be able to register you via Bank iD, but you can use <a href="https://lib.cas.cz/en/services/registration/" target="_blank" rel="noopener">another method of registration<span class="sr-only"> (opens in a new window)</span></a>.
form.newRegistration.section2.title=CONTACT INFORMATION
form.newRegistration.section2.subtitle=Legal basis: fulfillment of the contract
form.newRegistration.section2.text1=<strong>We will send you a link to pay the registration fee, your username, and basic registration and library services information to your email</strong>. The same information will also be displayed to you after submitting the registration form, so it will be <strong>available once</strong> even without providing an email. At the same time, we send messages related to services and registration via email (pickup and return dates, end of registration, individual study room rentals, or even information about automatic loan extensions).
form.newRegistration.section2.text2=We primarily use the phone number in cases where you forget your belongings in the study room or cloakroom, as it is the quickest way to notify you of this situation. We also use it, along with the contact address, for resolving outstanding obligations out of court. It is up to you whether you provide us with this information, as you can freely add, modify, and delete it in your user account.
form.newRegistration.section3.title=LIBRARY CARD REGISTRATION
form.newRegistration.section3.intro=If you would like to use our study room and/or borrow print books during the registration process, <strong>you can</strong> add the ID number of your chip card now; you will use this card as your library card.
form.newRegistration.section3.subtitle=LIBRARY CARD (MIFARE RFID tag identifier)
form.newRegistration.section3.accordionBtn.show=Show instructions
form.newRegistration.section3.accordionBtn.hide=Hide instructions
form.newRegistration.section3.accordionBtn.aria=Instructions for library card registration
form.newRegistration.section3.block1.h=Legal basis: fulfillment of the contract
form.newRegistration.section3.block1.text1=In the "Identifier value" field, enter the string you can find in the mobile application. After completing the registration, you can start using your card as a library card immediately without any additional steps.
form.newRegistration.section3.block1.text2=You can link a valid bank card with a chip and contactless technology, or a third-party chip card bearing your first and last name (e.g., ISIC card, Lítačka, INkarta from Czech Railways, etc.). You can also register it later with the staff at the registration desk in the study room. If you do not have such a card or do not wish to use it, you can pay a <a href="https://lib.cas.cz/o-knihovne/knihovni-rad/# 5-1-registration" target="_blank" rel="noopener">fee<span class="sr-only"> (opens in a new window)</span></a> to have a KNAV library card issued in the study room.
form.newRegistration.section3.block1.text3=<strong>You will not need a library card if you only wish to use services available via remote access.</strong>
form.newRegistration.section3.block2.h=Android
form.newRegistration.section3.block2.text=On an Android phone with NFC technology, you can find the string using a tool like <a href="https://play.google.com/store/apps/details?id=de.syss.MifareClassicTool&hl=en_US" target="_blank" rel="noopener">MIFARE Classic Tool<span class="sr-only"> (opens in a new window)</span></a>. After installing and launching the app, place the phone near the card and copy the UID value (the string might look like <strong>08D4EED6</strong>, but it could be longer or shorter). Ignore the message "Not a MIFARE Classic tag!".
form.newRegistration.section3.block3.h=iOS
form.newRegistration.section3.block3.text=On an iOS phone, use an app like <a href="https://apps.apple.com/us/app/nfc-tools/id1252962749" target="_blank" rel="noopener">NFC Tools<span class="sr-only"> (opens in a new window)</span></a>. After installing and launching the app, place the phone near the card and copy the value from the "Serial number" field, marked with a key icon. When copying the string, omit the colons (the string displayed as 04:F4:F6:2A:9E:4A:80 should be copied as: <strong>04F4F62A9E4A80</strong>).
form.newRegistration.section4.title=DISCOUNTED REGISTRATION FOR CAS EMPLOYEES
form.newRegistration.section4.text1=Provide proof of your employment relationship with CAS, and we will offer you a <a href="https://lib.cas.cz/en/services/registration/registration-complete/" target="_blank" rel="noopener">Complete<span class="sr-only"> (opens in a new window)</span></a> registration for 3 years free of charge. Simply fill in your work email address (with the CAS domain) in this form. If you don't have one, attach a copy of your service card or a completed <a href="https://lib.cas.cz/wp-content/uploads/2024/12/ppvztah_eng_new.pdf" target="_blank" rel="noopener">confirmation form<span class="sr-only"> (opens in a new window)</span></a>. Without verifying your employment relationship with CAS, we cannot offer the discounted registration.
form.newRegistration.declaration1.intro=I declare that:
form.newRegistration.declaration1=I have read the library regulations published at <a href="https://lib.cas.cz/en/about-the-library/knihovni-rad/" target="_blank" rel="noopener">https://lib.cas.cz/en/about-the-library/knihovni-rad/<span class="sr-only"> (opens in a new window)</span></a>, I agree to abide by them, and I will familiarize myself with any new version published on the KNAV website during my registration.
form.newRegistration.declaration2=I have checked the accuracy and completeness of my personal information provided in this registration form.
form.newRegistration.declaration3=I have been informed about how my personal data is processed by KNAV to the extent and for the purposes stated in the <a href="https://lib.cas.cz/en/about-the-library/knihovni-rad/#2-9-the-processing-of-personal-data" target="_blank" rel="noopener">library regulations<span class="sr-only"> (opens in a new window)</span></a> and the <a href="https://lib.cas.cz/wp-content/uploads/2024/11/Complete_Bank-iD_eng.pdf" target="_blank" rel="noopener">data processing information<span class="sr-only"> (opens in a new window)</span></a>.
form.newRegistration.declaration4.intro=I hereby commit to:
form.newRegistration.declaration4=paying the registration fee via the payment gateway within the payment deadline or by using a registration voucher.
form.membershipRenewal.section1.title=BASIC IDENTIFICATION INFORMATION
form.membershipRenewal.section1.subtitle=Legal basis: fulfillment of the contract
form.membershipRenewal.section1.text1=All of this information is required for renewing the contract, and without providing it, we will not be able to renew your registration via Bank iD. However, you can use <a href="https://lib.cas.cz/en/services/registration/" target="_blank" rel="noopener">another method to renew your registration<span class="sr-only"> (opens in a new window)</span></a>.
form.membershipRenewal.section2.title=CONTACT INFORMATION
form.membershipRenewal.section2.subtitle=Legal basis: fulfillment of the contract
form.membershipRenewal.section2.text1=We use contact information to inform you about services and registration, so it is entirely up to you whether you provide it. You can freely add, modify, or delete this information in your user account.
form.membershipRenewal.section3.title=LIBRARY CARD REGISTRATION
form.membershipRenewal.section3.intro=<strong>Your registered library card will remain valid even after you renew your registration</strong>. If you don't have one, or if you want to change it, <strong>you can</strong> link the ID of the chip card you want to start using as your library card after renewal.
form.membershipRenewal.section3.subtitle=LIBRARY CARD (MIFARE RFID tag identifier)
form.membershipRenewal.section3.accordionBtn.show=Show instructions
form.membershipRenewal.section3.accordionBtn.hide=Hide instructions
form.membershipRenewal.section3.accordionBtn.aria=Instructions for library card registration
form.membershipRenewal.section3.block1.h=Legal basis: fulfillment of the contract
form.membershipRenewal.section3.block1.text1=In the "Identifier value" field, enter the string you can find in the mobile application. After completing the registration, you can start using your card as a library card immediately without any additional steps.
form.membershipRenewal.section3.block1.text2=You can link a valid bank card with a chip and contactless technology, or a third-party chip card bearing your first and last name (e.g., ISIC card, Lítačka, INkarta from Czech Railways, etc.). You can also register it later with the staff at the registration desk in the study room. If you do not have such a card or do not wish to use it, you can pay a <a href="https://lib.cas.cz/en/about-the-library/library-regulations/#5-1-registration-library-card" target="_blank" rel="noopener">fee<span class="sr-only"> (opens in a new window)</span></a> to have a KNAV library card issued in the study room.
form.membershipRenewal.section3.block1.text3=<strong>You will not need a library card if you only wish to use services available via remote access.</strong>
form.membershipRenewal.section3.block2.h=Android
form.membershipRenewal.section3.block2.text=On an Android phone with NFC technology, use a tool like <a href="https://play.google.com/store/apps/details?id=de.syss.MifareClassicTool&hl=en_US" target="_blank" rel="noopener">MIFARE Classic Tool<span class="sr-only"> (opens in a new window)</span></a>. After installing and launching the app, place the phone near the card and enter the UID value (e.g., <strong>08D4EED6</strong>, though it could be longer or shorter). Ignore the message "Not a MIFARE Classic tag!".
form.membershipRenewal.section3.block3.h=iOS
form.membershipRenewal.section3.block3.text=On an iOS phone, use an app like <a href="https://apps.apple.com/us/app/nfc-tools/id1252962749" target="_blank" rel="noopener">NFC Tools<span class="sr-only"> (opens in a new window)</span></a>. After installing and launching the app, place the phone near the card and enter the value from the "Serial number" field marked by a key icon. When copying the string, omit the colons (e.g., 04:F4:F6:2A:9E:4A:80 should be entered as <strong>04F4F62A9E4A80</strong>).
form.membershipRenewal.section4.title=RENEWAL OF THE REGISTRATION FOR ACADEMY OF SCIENCES OF THE CZECH REPUBLIC (CAS) STAFF
form.membershipRenewal.section4.text1=Provide proof of your employment relationship with CAS, and we will renew your registration for another 3 years free of charge. Simply enter your work email address (with the CAS domain) in this form. If you do not have one, attach a copy of your service ID or a completed <a href="https://lib.cas.cz/wp-content/uploads/2024/12/ppvztah_eng_new.pdf" target="_blank" rel="noopener">confirmation<span class="sr-only"> (opens in a new window)</span></a>. Without verification of your employment with CAS, we cannot offer you discounted registration.
form.membershipRenewal.declaration1.intro=I declare that:
form.membershipRenewal.declaration1=I have read the library regulations published at <a href="https://lib.cas.cz/en/about-the-library/knihovni-rad/" target="_blank" rel="noopener">https://lib.cas.cz/en/about-the-library/knihovni-rad/<span class="sr-only"> (opens in a new window)</span></a>, I agree to abide by them, and I will familiarize myself with any new version published on the KNAV website during my registration.
form.membershipRenewal.declaration2=I have checked the accuracy and completeness of my personal information provided in this registration form.
