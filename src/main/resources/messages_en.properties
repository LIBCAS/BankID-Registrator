# Pages
page.home.heading1=Complete Registration
page.home.heading2=Online via Bank&nbsp;iD
page.home.description1=Verify your identity via Bank&nbsp;iD by providing the following details:<br><strong>first name</strong> and <strong>last name</strong>, <strong>date of birth</strong> and <strong>address in the Czech Republic</strong>.
page.home.heading3=Registration
page.home.description2=After identity verification:
page.home.description2.ol=<li>fill in and submit the registration form,</li><li>set a password for your user account,</li><li>pay the <a href="https://lib.cas.cz/en/about-the-library/library-regulations/#5-1-registration-library-card" target="_blank" rel="noopener">registration fee<span class="sr-only"> (opens in a new window)</span></a> via the payment gateway.</li>
page.home.description3=Before registering, familiarize yourself with our <a href="https://lib.cas.cz/en/about-the-library/library-regulations/#2-3-registration-complete" target="_blank" rel="noopener">Library Regulations<span class="sr-only"> (opens in a new window)</span></a> and the <a href="https://lib.cas.cz/wp-content/uploads/2024/11/Complete_Bank-iD_eng.pdf" target="_blank" rel="noopener">Personal Data Processing Policy<span class="sr-only"> (opens in a new window)</span></a>. The registration is valid for 1&nbsp;year. <strong>You can start using your services immediately after the payment is credited to our account.</strong>
page.home.heading4=Registration Renewal
page.home.description4=After identity verification:
page.home.description4.ol=<li>update your personal data and submit the registration form,</li><li>pay the <a href="https://lib.cas.cz/en/about-the-library/library-regulations/#5-1-registration-library-card" target="_blank" rel="noopener">registration fee<span class="sr-only"> (opens in a new window)</span></a> via the payment gateway.</li>
page.home.description5=Before renewing your registration, familiarize yourself with our <a href="https://lib.cas.cz/en/about-the-library/library-regulations/#2-3-registration-complete" target="_blank" rel="noopener">Library Regulations<span class="sr-only"> (opens in a new window)</span></a> and the <a href="https://lib.cas.cz/wp-content/uploads/2024/11/Complete_Bank-iD_eng.pdf" target="_blank" rel="noopener">Personal Data Processing Policy<span class="sr-only"> (opens in a new window)</span></a>. <strong>The ability to use library services is temporarily suspended between the time the form is submitted and the fee is paid.</strong> The renewed registration is valid for 1&nbsp;year. Login details do not change with the renewal of registration.
page.home.heading5=Redemption of a single-use registration voucher
page.home.description6=When registering, after submitting the registration form, set a password and enter the voucher code. When renewing your registration, enter the voucher code directly in the registration form. The fee will be covered by this code, eliminating the need for payment. You can also enter the voucher code on the payment page before proceeding to the payment gateway (before clicking the “Pay Registration Fee” button).
page.home.heading6=We register employees of the Czech Academy of Sciences free of charge
page.home.description7=Provide proof of your status as a CAS employee by entering your work email or by attaching a service ID card or a <a href="https://lib.cas.cz/wp-content/uploads/2024/12/ppvztah_eng_new.pdf" target="_blank" rel="noopener">confirmation from your CAS workplace<span class="sr-only"> (opens in a new window)</span></a> to the registration form. You can start using your registration immediately after setting your password, or your renewed registration after updating your personal data. Registration/renewed registration is valid for 3 years.
page.home.comgateText=Online payments are provided by the Comgate payment gateway. The service provider, Comgate a.s., is a licensed payment institution operating under the supervision of the Czech National Bank. Payments made through the payment gateway are fully secured and all information is encrypted. More information and contacts at <a href="https://www.comgate.cz" target="_blank" rel="noopener">www.comgate.cz<span class="sr-only"> (opens in a new window)</span></a>.
