# Pages
page.home.heading1=Registrácia Komplet
page.home.heading2=Online prostredníctvom Bank&nbsp;iD
page.home.description1=Overte svoju totožnosť prostredníctvom Bank&nbsp;iD odovzdaním údajov:<br><strong>meno</strong> a <strong>priezvisko</strong>, <strong>dátum narodenia</strong> a <strong>adresa v Českej republike</strong>.
page.home.heading3=Registrácia
page.home.description2=Po overení totožnosti:
page.home.description2.ol=<li>vyplňte a odošlite registračný formulár,</li><li>nastavte heslo k svojmu používateľskému účtu,</li><li>uhraďte <a href="https://lib.cas.cz/o-knihovne/knihovni-rad/#5-1-registrace" target="_blank" rel="noopener">registračný poplatok<span class="sr-only"> (otvorí sa v novom okne)</span></a> prostredníctvom platobnej brány.</li>
page.home.description3=Pred registráciou sa oboznámte s <a href="https://lib.cas.cz/o-knihovne/knihovni-rad/" target="_blank" rel="noopener">knižničným poriadkom<span class="sr-only"> (otvorí sa v novom okne)</span></a> a spôsobom <a href="https://lib.cas.cz/wp-content/uploads/2024/11/Komplet_Bank-iD_cze.pdf" target="_blank" rel="noopener">spracovania osobných údajov<span class="sr-only"> (otvorí sa v novom okne)</span></a>. Platnosť registrácie je 1&nbsp;rok. <strong>Naše služby môžete začať využívať bezprostredne po pripísaní platby na náš účet.</strong>
page.home.heading4=Obnovenie registrácie
page.home.description4=Po overení totožnosti:
page.home.description4.ol=<li>aktualizujte svoje osobné údaje a odošlite registračný formulár,</li><li>uhraďte <a href="https://lib.cas.cz/o-knihovne/knihovni-rad/#5-1-registrace" target="_blank" rel="noopener">registračný poplatok<span class="sr-only"> (otvorí sa v novom okne)</span></a> prostredníctvom platobnej brány.</li>
page.home.description5=Pred obnovením registrácie sa oboznámte s <a href="https://lib.cas.cz/o-knihovne/knihovni-rad/" target="_blank" rel="noopener">knižničným poriadkom<span class="sr-only"> (otvorí sa v novom okne)</span></a> a spôsobom <a href="https://lib.cas.cz/wp-content/uploads/2024/11/Komplet_Bank-iD_cze.pdf" target="_blank" rel="noopener">spracovania osobných údajov<span class="sr-only"> (otvorí sa v novom okne)</span></a>. <strong>Možnosť využívať služby knižnice je v období medzi odoslaním formulára a úhradou poplatku dočasne pozastavená.</strong> Platnosť obnovenej registrácie je 1&nbsp;rok. Prihlasovacie údaje sa obnovením registrácie nemenia.
page.home.heading5=Využitie jednorazového poukazu na registráciu
page.home.description6=Pri registrácii po odoslaní registračného formulára si nastavte heslo a zadajte kód poukážky. Pri obnovení registrácie zadajte kód poukážky priamo do registračného formulára. Poplatok bude uhradený týmto kódom bez nutnosti platby. Kód poukážky môžete zadať aj na stránke platby, pred vstupom do platobnej brány (pred stlačením tlačidla „Uhradiť registračný poplatok“).
page.home.heading6=Pracovníkov AV ČR registrujeme zdarma
page.home.description7=Status pracovníka AV ČR doložte uvedením pracovného e-mailu alebo priložením služobného preukazu či <a href="https://www.lib.cas.cz/wp-content/uploads/ppvztah_new.pdf" target="_blank" rel="noopener">potvrdenia od pracoviska AV ČR<span class="sr-only"> (otvorí sa v novom okne)</span></a> k registračnému formuláru. Registráciu môžete začať využívať bezprostredne po nastavení hesla, obnovenú registráciu po aktualizácii osobných údajov. Registrácia/obnovená registrácia je platná 3 roky.
page.home.comgateText=Online platby pre nás zabezpečuje platobná brána Comgate. Poskytovateľ služby, spoločnosť Comgate a.s., je licencovaná platobná inštitúcia pôsobiaca pod dohľadom Českej národnej banky. Platby prebiehajúce cez platobnú bránu sú plne zabezpečené a všetky informácie sú šifrované. Ďalšie informácie a kontakty na <a href="https://www.comgate.cz" target="_blank" rel="noopener">www.comgate.cz<span class="sr-only"> (otvorí sa v novom okne)</span></a>.
