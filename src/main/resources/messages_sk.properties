page.bankidCbError.invalidGrant.description=Odkaz na dokončenie overenia už nemožno použiť. Môže sa to stať po obnovení starej stránky, návrate tlačidlom späť alebo po dlhšej nečinnosti. Spustite prosím overenie znova.
