form.membershipRenewal.declaration1=sa oboznámil/a s knižničným poriadkom zverejneným na <a href="https://www.lib.cas.cz/o-knihovne/knihovni-rad/" target="_blank" rel="noopener">https://www.lib.cas.cz/o-knihovne/knihovni-rad/<span class="sr-only"> (otvorí sa v novom okne)</span></a>, zaväzujem sa ho dodržiavať a počas platnosti mojej registrácie sa oboznámiť s každou jeho novou verziou zverejnenou na webovej stránke KNAV,
