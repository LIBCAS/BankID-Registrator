page.bankidCbError.eidDoesntExistNotEligible.title=Bank iD nie je pre tento účet k dispozícii
page.bankidCbError.eidDoesntExistNotEligible.description=Vaša banka uviedla, že pre tento účet nespĺňate podmienky na používanie Bank iD. Obráťte sa prosím na svoju banku alebo využite iný spôsob registrácie.
