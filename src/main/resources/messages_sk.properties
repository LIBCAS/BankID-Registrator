form.membershipRenewal.section3.block1.text2=Môžete pripojiť svoju platnú bankovú kartu s čipom a bezkontaktnou technológiou alebo čipovú kartu tretej strany s menom a priezviskom (napr.: karta ISIC, Lítačka, INkarta Českých dráh atď.). Môžete ju zaregistrovať aj neskôr u pracovníkov registračného pultu v študovni. Ak takúto kartu nemáte alebo ju nechcete použiť, môžete si za <a href="https://lib.cas.cz/o-knihovne/knihovni-rad/#5-1-registrace" target="_blank" rel="noopener">poplatok<span class="sr-only"> (otvorí sa v novom okne)</span></a> nechať si v študovni vyhotoviť čitateľský preukaz KNAV.
