form.membershipRenewal.section3.block2.h=Android
form.membershipRenewal.section3.block2.text=Na telefóne s Androidom a technológiou NFC použite napríklad nástroj <a href="https://play.google.com/store/apps/details?id=de.syss.MifareClassicTool&hl=en_US" target="_blank" rel="noopener">MIFARE Classic Tool<span class="sr-only"> (otvorí sa v novom okne)</span></a>. Po inštalácii a spustení aplikácie priložte telefón ku karte a zadajte hodnotu UID (napríklad <strong>08D4EED6</strong>, aj keď môže byť dlhšia alebo kratšia). Hlásenie „Not a MIFARE Classic tag!“ ignorujte.
form.membershipRenewal.section3.block3.h=iOS
form.membershipRenewal.section3.block3.text=Na telefóne s operačným systémom iOS použite napríklad aplikáciu <a href="https://apps.apple.com/us/app/nfc-tools/id1252962749" target="_blank" rel="noopener">NFC Tools<span class="sr-only"> (otvorí sa v novom okne)</span></a>. Po inštalácii a spustení aplikácie priložte telefón ku karte a do formulára zadajte hodnotu z poľa „Serial number“ označeného ikonou kľúča. Pri opisovaní reťazca vynechajte dvojbodky (reťazec zobrazený 04:F4:F6:2A:9E:4A:80 opíšte takto: <strong>04F4F62A9E4A80</strong>).
form.membershipRenewal.section4.title=OBNOVENIE REGISTRÁCIE PRACOVNÍKA SAV
form.membershipRenewal.section4.text1=Predložte dôkaz o vašom pracovnom vzťahu k SAV a my vám obnovíme registráciu na ďalšie 3 roky bez poplatku. Stačí, ak v tomto formulári zadáte svoju pracovnú e-mailovú adresu (s doménou pracoviska SAV). Ak ju nemáte, priložte kópiu služobného preukazu alebo vyplnené <a href="https://lib.cas.cz/wp-content/uploads/ppvztah_new.pdf" target="_blank" rel="noopener">potvrdenie<span class="sr-only"> (otvorí sa v novom okne)</span></a>. Bez overenia pracovného vzťahu k SAV vám nemôžeme poskytnúť zvýhodnenú registráciu.
