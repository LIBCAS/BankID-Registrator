page.bankidCbError.userNotEligibleMethodInsufficient.description=Poskytovateľ Bank iD uviedol, že pre tento typ služby nie je k dispozícii dostatočne bezpečný spôsob overenia. Skúste prosím iný spôsob overenia vo svojej banke alebo iný spôsob registrácie.
page.bankidCbError.userNotEligibleDataOrAge.title=Nie je možné pokračovať kvôli obmedzeniu účtu
page.bankidCbError.userNotEligibleDataOrAge.description=Poskytovateľ Bank iD uviedol, že chýbajú povinné údaje alebo vek neumožňuje túto službu použiť. Overte si prosím údaje vo svojej banke alebo využite iný spôsob registrácie.
