form.newRegistration.section1.title=ZÁKLADNÉ IDENTIFIKAČNÉ ÚDAJE
form.newRegistration.section1.subtitle=Právny základ: plnenie zmluvy
form.newRegistration.section1.text1=Všetky tieto údaje slúžia na uzavretie zmluvy. Bez ich odovzdania vás nebudeme môcť zaregistrovať prostredníctvom Bank iD, môžete ale využiť <a href="https://lib.cas.cz/sluzby/registrace/" target="_blank" rel="noopener">iný spôsob registrácie<span class="sr-only"> (otvorí sa v novom okne)</span></a>.
form.newRegistration.section2.title=KONTAKTNÉ ÚDAJE
form.newRegistration.section2.subtitle=Právny základ: plnenie zmluvy
form.newRegistration.section2.text1=<strong>Na e-mail Vám pošleme odkaz na úhradu registračného poplatku, používateľské meno a základné informácie o registrácii a službách knižnice</strong>. Rovnaké informácie Vám zobrazíme aj po odoslaní registračného formulára, takže Vám budú <strong>jednorazovo</strong> k dispozícii aj bez poskytnutia e-mailu. Zároveň e-mailom zasielame správy týkajúce sa služieb a registrácie (termín vyzdvihnutia a vrátenia kníh, koniec registrácie, nájom individuálnej študovne alebo napríklad informácie o automatickom predlžovaní výpožičnej lehoty).
form.newRegistration.section2.text2=Telefón využívame predovšetkým v prípadoch, keď zabudnete svoje veci v študovni alebo v šatni, pretože je to najrýchlejší spôsob, ako Vás na túto situáciu upozorniť. Zároveň ho a kontaktnú adresu využívame na mimosúdne vyrovnanie nesplnených záväzkov. Je len na Vás, či nám tieto údaje poskytnete, preto ich môžete vo svojom používateľskom účte voľne pridávať, upravovať a mazať.
form.newRegistration.section3.title=REGISTRÁCIA ČITATEĽSKÉHO PREUKAZU
form.newRegistration.section3.intro=Ak chcete počas registrácie navštevovať našu študovňu a/alebo si požičiavať tlačené knihy domov, môžete už teraz priradiť identifikačný kód svojej čipovej karty, ktorú budete používať ako čitateľský preukaz.
form.newRegistration.section3.subtitle=ČITATEĽSKÝ PREUKAZ (identifikátor RFID čipu karty MIFARE)
form.newRegistration.section3.accordionBtn.show=Zobraziť inštrukcie
form.newRegistration.section3.accordionBtn.hide=Skryť inštrukcie
form.newRegistration.section3.accordionBtn.aria=Instrukce pro registraci čitateľského preukazu
form.newRegistration.section3.block1.h=Právny základ: plnenie zmluvy
form.newRegistration.section3.block1.text1=Do poľa “Hodnota identifikátora” prepíšte reťazec, ktorý zistíte v mobilnej aplikácii. Po dokončení registrácie potom môžete svoju kartu okamžite používať ako čitateľský preukaz bez ďalších krokov.
form.newRegistration.section3.block1.text2=Môžete pripojiť svoju platnú bankovú kartu s čipom a bezkontaktnou technológiou alebo čipovú kartu tretej strany s menom a priezviskom (napr.: karta ISIC, Lítačka, INkarta Českých dráh atď.). Môžete ju zaregistrovať aj neskôr u pracovníkov registračného pultu v študovni. Ak takúto kartu nemáte alebo ju nechcete použiť, môžete si za <a href="https://lib.cas.cz/o-knihovne/knihovni-rad/#5-1-registrace" target="_blank" rel="noopener">poplatok<span class="sr-only"> (otvorí sa v novom okne)</span></a> nechať si v študovni vyhotoviť čitateľský preukaz KNAV.
form.newRegistration.section3.block1.text3=<strong>Čitateľský preukaz nebudete potrebovať, ak chcete využívať iba služby dostupné prostredníctvom vzdialeného prístupu.</strong>
form.newRegistration.section3.block2.h=Android
form.newRegistration.section3.block2.text=Na telefóne s operačným systémom Android a s technológiou NFC zistíte reťazec napríklad pomocou nástroja <a href="https://play.google.com/store/apps/details?id=de.syss.MifareClassicTool&hl=en_US" target="_blank" rel="noopener">MIFARE Classic Tool<span class="sr-only"> (otvorí sa v novom okne)</span></a>. Po inštalácii a spustení aplikácie priložte telefón ku karte a do formulára prepíšte hodnotu UID (reťazec môže vyzerať napríklad takto <strong>08D4EED6</strong>, ale môže byť aj dlhší alebo kratší). Hlásenie „Not a MIFARE Classic tag!“ ignorujte.
form.newRegistration.section3.block3.h=iOS
form.newRegistration.section3.block3.text=Na telefóne s operačným systémom iOS použite napríklad aplikáciu <a href="https://apps.apple.com/us/app/nfc-tools/id1252962749" target="_blank" rel="noopener">NFC Tools<span class="sr-only"> (otvorí sa v novom okne)</span></a>. Po inštalácii a spustení aplikácie priložte telefón ku karte a do formulára prepíšte hodnotu z poľa „Serial number“ označenú ikonou kľúča. Pri opisovaní reťazca vynechajte dvojbodky (reťazec zobrazený ako 04:F4:F6:2A:9E:4A:80 prepíšte takto: <strong>04F4F62A9E4A80</strong>).
form.newRegistration.section4.title=ZVÝHODNENÁ REGISTRÁCIA PRE PRACOVNÍKOV AV ČR
form.newRegistration.section4.text1=Preukážte svoj pracovnoprávny vzťah k AV ČR a my Vám poskytneme registráciu <a href="https://lib.cas.cz/sluzby/registrace/registrace-komplet/" target="_blank" rel="noopener">Komplet<span class="sr-only"> (otvorí sa v novom okne)</span></a> na 3 roky bez poplatku. Stačí, keď v tomto formulári vyplníte svoju pracovnú e-mailovú adresu (s doménou pracoviska AV ČR). Ak ju nemáte, priložte kópiu služobného preukazu alebo vyplneného <a href="https://lib.cas.cz/wp-content/uploads/ppvztah_new.pdf" target="_blank" rel="noopener">potvrdenia<span class="sr-only"> (otvorí sa v novom okne)</span></a>. Bez overenia pracovnoprávneho vzťahu k AV ČR Vám zvýhodnenú registráciu nemôžeme poskytnúť.
form.newRegistration.declaration1.intro=Prehlasujem, že som:
form.newRegistration.declaration1=sa oboznámil/a s knižničným poriadkom zverejneným na <a href="https://www.lib.cas.cz/o-knihovne/knihovni-rad/" target="_blank" rel="noopener">https://www.lib.cas.cz/o-knihovne/knihovni-rad/<span class="sr-only"> (otvorí sa v novom okne)</span></a>, zaväzujem sa ho dodržiavať a počas platnosti mojej registrácie sa oboznámiť s každou jeho novou verziou zverejnenou na webovej stránke KNAV,
form.newRegistration.declaration2=skontroloval/a správnosť a úplnosť mojich osobných údajov uvedených v tomto registračnom formulári,
form.newRegistration.declaration3=sa oboznámil/a so spôsobom spracovania mojich osobných údajov KNAV v rozsahu a v súlade s účelom uvedeným v <a href="https://www.lib.cas.cz/o-knihovne/knihovni-rad/#kr29" target="_blank" rel="noopener">knižničnom poriadku<span class="sr-only"> (otvorí sa v novom okne)</span></a> a v <a href="https://lib.cas.cz/wp-content/uploads/2024/11/Komplet_Bank-iD_cze.pdf" target="_blank" rel="noopener">informácii o spracovaní osobných údajov<span class="sr-only"> (otvorí sa v novom okne)</span></a>.
form.newRegistration.declaration4.intro=A zaväzujem sa:
form.newRegistration.declaration4=uhradiť registračný poplatok v stanovenej lehote prostredníctvom platobnej brány alebo registračným poukazom.
form.membershipRenewal.section1.title=ZÁKLADNÉ IDENTIFIKAČNÉ ÚDAJE
form.membershipRenewal.section1.subtitle=Právny základ: plnenie zmluvy
form.membershipRenewal.section1.text1=Všetky tieto údaje sú potrebné na obnovenie zmluvy a bez ich poskytnutia Vám nebudeme môcť obnoviť registráciu prostredníctvom Bank iD. Môžete však využiť <a href="https://lib.cas.cz/sluzby/registrace/" target="_blank" rel="noopener">iný spôsob obnovenia registrácie<span class="sr-only"> (otvorí sa v novom okne)</span></a>.
form.membershipRenewal.section2.title=KONTAKTNÉ ÚDAJE
form.membershipRenewal.section2.subtitle=Právny základ: plnenie zmluvy
form.membershipRenewal.section2.text1=Kontaktné údaje používame na informovanie o službách a registrácii, je teda len na Vás, či nám ich poskytnete. Tieto údaje môžete voľne pridávať, upravovať a mazať aj vo svojom používateľskom konte.
form.membershipRenewal.section3.title=REGISTRÁCIA ČITATEĽSKÉHO PREUKAZU
form.membershipRenewal.section3.intro=<strong>Váš registrovaný čitateľský preukaz zostane platný aj po obnovení registrácie</strong>. Ak ho nemáte alebo si ho chcete zmeniť, <strong>môžete</strong> pripojiť identifikátor svojej čipovej karty, ktorú chcete po obnovení začať používať ako čitateľský preukaz.
form.membershipRenewal.section3.subtitle=ČITATEĽSKÝ PREUKAZ (identifikátor RFID čipu karty MIFARE)
form.membershipRenewal.section3.accordionBtn.show=Zobraziť inštrukcie
