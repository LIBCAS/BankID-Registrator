<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
    <head></head>
    <body class="page-dashboard page-app-settings">
        <main layout:fragment="content" class="mb-10 container mx-auto p-5">
            <h1 class="text-2xl font-bold mb-6" th:text="#{appSettings.title}"></h1>

            <p th:if="${successMessage}" class="mb-4 rounded bg-green-100 p-3 text-green-800" th:text="${successMessage}"></p>
            <p th:if="${errorMessage}" class="mb-4 rounded bg-red-100 p-3 text-red-800" th:text="${errorMessage}"></p>

            <section class="max-w-3xl rounded-lg border border-gray-200 bg-white p-5">
                <h2 class="text-xl font-semibold mb-2" th:text="#{appSettings.supportEmails.title}"></h2>
                <p class="mb-5 text-sm text-gray-600" th:text="#{appSettings.supportEmails.help}"></p>

                <form th:action="@{/dashboard/settings/support-emails}" method="post" class="flex flex-col gap-4">
                    <div th:each="supportEmail, iter : ${supportEmailRows}" class="flex items-center gap-3">
                        <input type="radio" name="primaryIndex" th:value="${iter.index}" th:checked="${supportEmail.primary}" th:aria-label="#{appSettings.supportEmails.primary}" />
                        <input type="email" name="emails" th:value="${supportEmail.email}" class="w-full rounded border border-gray-300 p-2" th:placeholder="#{appSettings.supportEmails.emailPlaceholder}" />
                        <span th:if="${supportEmail.primary}" class="text-sm font-semibold text-libcas-blue" th:text="#{appSettings.supportEmails.primary}"></span>
                    </div>
                    <button type="submit" class="mt-2 self-start rounded bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700" th:text="#{appSettings.save}"></button>
                </form>
            </section>

            <section class="mt-6 max-w-3xl rounded-lg border border-gray-200 bg-white p-5">
                <h2 class="text-xl font-semibold mb-2" th:text="#{appSettings.voucherPrinter.title}"></h2>
                <p class="mb-5 text-sm text-gray-600" th:text="#{appSettings.voucherPrinter.help}"></p>

                <form th:action="@{/dashboard/settings/voucher-printer}" method="post" class="flex flex-col gap-4">
                    <div>
                        <label for="voucherPrinterAppUrl" class="mb-1 block text-sm font-medium text-gray-700" th:text="#{appSettings.voucherPrinter.urlLabel}"></label>
                        <input id="voucherPrinterAppUrl" type="url" name="voucherPrinterAppUrl" th:value="${voucherPrinterAppUrl}"
                               class="w-full rounded border border-gray-300 p-2" th:placeholder="#{appSettings.voucherPrinter.urlPlaceholder}" />
                    </div>
                    <button type="submit" class="mt-2 self-start rounded bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700" th:text="#{appSettings.save}"></button>
                </form>
            </section>
        </main>
    </body>
</html>
