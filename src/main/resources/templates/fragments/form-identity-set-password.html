<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <div th:fragment="form-identity-set-password">
        <form id="form-identity-password" th:action="@{/identity/set-password}" th:object="${passwordDTO}" method="post" class="max-w-md mx-auto bg-white p-8 shadow-md rounded-lg">
            <div class="mb-4 p-4 text-sm text-white bg-libcas-blue" th:utext="#{form.patronPassword.guide}"></div>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" required />
            <input type="hidden" name="token" th:value="${token}" readonly />
            
            <!-- New Password Field -->
            <div class="mb-4 relative">
                <label for="newPassword" th:text="#{page.identityPassword.newPassword}" class="block text-sm font-medium text-gray-700 mb-2">New Password:</label>
                <div class="relative">
                    <input type="password" id="newPassword" th:field="*{newPassword}"
                        class="mt-1 block w-full p-2 pe-10 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required />
                    <button type="button" class="password-toggler absolute inset-y-0 right-0 pr-3 flex items-center text-sm leading-5"
                        data-field-id="newPassword" tabindex="-1">
                        <i class="fa fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
                <span th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="text-red-500"></span>
            </div>

            <!-- Repeat New Password Field -->
            <div class="mb-4 relative">
                <label for="repeatNewPassword" th:text="#{page.identityPassword.repeatNewPassword}"
                    class="block text-sm font-medium text-gray-700 mb-2">Repeat New Password:</label>
                <div class="relative">
                    <input type="password" id="repeatNewPassword" th:field="*{repeatNewPassword}"
                        class="mt-1 block w-full p-2 pe-10 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required />
                    <button type="button" class="password-toggler absolute inset-y-0 right-0 pr-3 flex items-center text-sm leading-5"
                        data-field-id="repeatNewPassword" tabindex="-1">
                        <i class="fa fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
                <span th:if="${#fields.hasErrors('repeatNewPassword')}" th:errors="*{repeatNewPassword}" class="text-red-500"></span>
            </div>

            <!-- Voucher code input (non-employees only) -->
            <div th:if="${!patronIsCasEmployee}" class="mt-6 pt-6 border-t border-gray-200">
                <div class="mb-2">
                    <label for="voucherCode" th:text="#{voucher.label}" class="block text-sm font-medium text-gray-700 mb-2"></label>
                    <p class="text-xs text-gray-500 mb-2" th:text="#{voucher.hint}"></p>
                    <div class="flex gap-2">
                        <input type="text" id="voucherCode" name="voucherCode" maxlength="50"
                            class="flex-1 p-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm uppercase"
                            th:placeholder="#{voucher.placeholder}" autocomplete="off" />
                        <button type="button" id="btn-validate-voucher"
                            class="px-4 py-2 rounded-md bg-gray-900 text-white hover:bg-gray-700 focus:outline-none focus:shadow-outline text-sm font-medium"
                            th:text="#{voucher.validateBtn}"></button>
                    </div>
                </div>
                <div id="voucher-result" class="hidden mt-2 p-3 rounded-md text-sm"></div>
            </div>

            <!-- Submit Button -->
            <div class="flex justify-center mt-8">
                <button type="submit" th:text="${patronIsCasEmployee} ? #{page.identityPassword.setPassword} : #{page.identityPassword.setPasswordAndPayFee}" class="flex text-xs font-bold leading-[18px] uppercase justify-center py-[10px] px-[20px] rounded-full bg-libcas-blue text-white focus:outline-none focus:shadow-outline"></button>
            </div>
        </form>
    </div>

</html>
