<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>
    <title th:text="${appName} + ' - ' + ${pageTitle}"></title>
    <link rel="shortcut icon" href="/bankid-registrator/img/favicon.ico" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- TailwindCSS, Flowbite -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'c-footer': '#212121',
                    },
                    fontFamily: {
                        sans: ["Montserrat", "ui-sans-serif", "system-ui", "sans-serif"],
                    },
                },
            },
        }
    </script>

    <!-- Filepond stylesheets -->
    <link rel="stylesheet"
        href="https://unpkg.com/filepond-plugin-image-preview/dist/filepond-plugin-image-preview.min.css"
        type="text/css" />
    <link rel="stylesheet" href="https://unpkg.com/filepond/dist/filepond.min.css" type="text/css" />

    <!-- Font Awesome v6.6.0 -->
    <script src="https://kit.fontawesome.com/a2a9ce62a1.js" crossorigin="anonymous"></script>

    <!-- autocomplete.js -->
    <link rel="stylesheet" href="/bankid-registrator/assets/dist/vendor/autocomplete.js@10.2.7/dist/css/autoComplete.02.min.css">

    <!-- Custom stylesheets -->
    <link rel="stylesheet" href="/bankid-registrator/assets/dist/css/main.css" type="text/css" />
</head>

</html>
