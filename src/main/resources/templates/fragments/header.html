<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <header th:fragment="header" class="fixed w-full z-20 top-0 start-0 border-b border-gray-200 bg-white print:hidden no-print">
        <nav class="bg-white w-full border-b border-gray-200" th:aria-label="#{message.mainNavigation}">
            <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto px-4 py-4 xl:py-1">
                <a th:href="@{/welcome}" class="flex items-center space-x-3 rtl:space-x-reverse" th:aria-label="#{message.goToHomepage}" tabindex="0">
                    <img th:if="${lang == 'cs'}" height="42" style="height: 42px; width: auto; max-height: 42px;" src="https://lib.cas.cz/registrace/public/logo-knav-cs.png" th:alt="#{message.libcasLogo}" />
                    <img th:if="${lang == 'en'}" height="42" style="height: 42px; width: auto; max-height: 42px;" src="https://lib.cas.cz/registrace/public/logo-knav-en.png" th:alt="#{message.libcasLogo}" />
                    <img th:if="${lang == 'sk'}" height="42" style="height: 42px; width: auto; max-height: 42px;" src="https://lib.cas.cz/registrace/public/logo-knav-cs.png" th:alt="#{message.libcasLogo}" />
                </a>

                <!--/* Header Actions */-->
                <div class="header-actions flex items-center xl:order-2 space-x-3 xl:space-x-4 rtl:space-x-reverse justify-end xl:justify-center" th:classappend="${isIdentityLoggedIn} ? ' header-actions--loggedin'">
                    <div id="header-actions-desktop-slot" class="flex items-center space-x-3 lg:space-x-4 rtl:space-x-reverse">
                        <!--/* Language Switcher */-->
                        <div id="language-switcher" class="relative">
                            <button type="button" data-dropdown-toggle="language-dropdown-menu" aria-haspopup="true" aria-expanded="false" th:aria-label="#{message.language}" th:title="#{message.selectLanguage}" tabindex="0" class="inline-flex items-center font-medium justify-center px-4 py-2 text-sm text-gray-900 rounded-lg cursor-pointer hover:bg-gray-100">
                                <svg th:if="${lang == 'cs'}" th:insert="~{fragments/svg/flag-cze :: flag-cze}" class="w-5 h-5 rounded-full" aria-hidden="true"></svg>
                                <svg th:if="${lang == 'en'}" th:insert="~{fragments/svg/flag-gbr :: flag-gbr}" class="w-5 h-5 rounded-full" aria-hidden="true"></svg>
                                <svg th:if="${lang == 'sk'}" th:insert="~{fragments/svg/flag-skv :: flag-skv}" class="w-5 h-5 rounded-full" aria-hidden="true"></svg>
                                <span class="sr-only" th:text="#{message.selectLanguage}"></span>
                            </button>
                            <div class="z-50 hidden my-4 text-base list-none bg-white divide-y divide-gray-100 rounded-lg shadow"
                                id="language-dropdown-menu">
                                <ul class="py-2 font-medium" role="menu">
                                    <li class="text-xs font-bold uppercase" role="none">
                                        <a th:href="@{|${currentUrl}${currentUrlParamsConnector}lang=cs|}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" th:classappend="${lang == 'cs'} ? 'pointer-events-none opacity-50'" role="menuitem" lang="cs" tabindex="0">
                                            <div class="inline-flex items-center">
                                                <svg th:insert="~{fragments/svg/flag-cze :: flag-cze}" class="w-5 h-5 rounded-full me-2" aria-hidden="true"></svg>
                                                <span th:text="#{message.inCzech}"></span>
                                            </div>
                                        </a>
                                    </li>
                                    <li class="text-xs font-bold uppercase" role="none">
                                        <a th:href="@{|${currentUrl}${currentUrlParamsConnector}lang=en|}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" th:classappend="${lang == 'en'} ? 'pointer-events-none opacity-50'" role="menuitem" lang="en" tabindex="0">
                                            <div class="inline-flex items-center">
                                                <svg th:insert="~{fragments/svg/flag-gbr :: flag-gbr}" class="w-5 h-5 rounded-full me-2" aria-hidden="true"></svg>
                                                <span th:text="#{message.inEnglish}"></span>
                                            </div>
                                        </a>
                                    </li>
                                    <!--/* 
                                    <li class="text-xs font-bold uppercase" role="none">
                                        <a th:href="@{|${currentUrl}${currentUrlParamsConnector}lang=sk|}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" th:classappend="${lang == 'sk'} ? 'pointer-events-none opacity-50'" role="menuitem" lang="sk" tabindex="0">
                                            <div class="inline-flex items-center">
                                                <svg th:insert="~{fragments/svg/flag-skv :: flag-skv}" class="w-5 h-5 rounded-full me-2" aria-hidden="true"></svg>
                                                <span th:text="#{message.inSlovak}"></span>
                                            </div>
                                        </a>
                                    </li> 
                                    */-->
                                </ul>
                            </div>
                        </div>

                        <!--/* Logout Button (Only if identity user is logged in) */-->
                        <a th:if="${isIdentityLoggedIn}" th:href="@{/identity/logout-redirect}" id="identity-logout" class="flex text-xs font-bold leading-[18px] uppercase justify-center py-[10px] px-[20px] rounded-full bg-libcas-blue text-white focus:outline-none focus:shadow-outline" th:text="#{message.logout}" tabindex="0"></a>
                        <!--/* Logout Button (Only if admin is logged in) */-->
                        <a th:if="${isAdminPage}" th:href="@{/user/logout}" id="admin-logout" class="flex text-xs font-bold leading-[18px] uppercase justify-center py-[10px] px-[20px] rounded-full bg-libcas-blue text-white focus:outline-none focus:shadow-outline" th:text="#{message.logout}" tabindex="0"></a>
                    </div>

                    <!--/* Hamburger Button (Mobile Only) */-->
                    <button data-collapse-toggle="navbar-sticky" type="button" class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg xl:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200" aria-controls="navbar-sticky" aria-expanded="false" tabindex="0">
                        <span class="sr-only" th:text="#{message.openMainMenu}"></span>
                        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"/>
                        </svg>
                    </button>
                </div>

                <!--/* Menu Navigation Links (Collapsible) */-->
                <div class="items-center justify-between hidden w-full xl:flex xl:w-auto xl:order-1" id="navbar-sticky">
                    <div id="header-actions-mobile-slot" class="md:hidden px-0 py-3 flex flex-row justify-end gap-x-3"></div>

                    <!--/* Admin Navigation (only on admin/dashboard pages) */-->
                    <ul th:if="${isAdminPage}" class="flex flex-col p-4 font-medium border border-gray-100 rounded-lg bg-gray-50 md:mt-4 xl:space-x-3 rtl:space-x-reverse xl:flex-row xl:mt-0 xl:border-0 xl:bg-white">
                        <li class="text-xs font-bold uppercase">
                            <a th:href="@{/dashboard}" class="block py-2 px-3 text-gray-900 rounded hover:bg-gray-100 lg:hover:bg-transparent lg:hover:text-blue-700" tabindex="0">
                                <span th:text="#{menu.admin.dashboard}"></span>
                            </a>
                        </li>
                        <li class="text-xs font-bold uppercase">
                            <a th:href="@{/dashboard/vouchers}" class="block py-2 px-3 text-gray-900 rounded hover:bg-gray-100 lg:hover:bg-transparent lg:hover:text-blue-700" tabindex="0">
                                <span th:text="#{menu.admin.vouchers}"></span>
                            </a>
                        </li>
                        <li class="text-xs font-bold uppercase">
                            <a th:href="@{/dashboard/vouchers/new}" class="block py-2 px-3 text-gray-900 rounded hover:bg-gray-100 lg:hover:bg-transparent lg:hover:text-blue-700" tabindex="0">
                                <span th:text="#{menu.admin.newVoucher}"></span>
                            </a>
                        </li>
                        <li class="text-xs font-bold uppercase">
                            <a th:href="@{/dashboard/settings}" class="block py-2 px-3 text-gray-900 rounded hover:bg-gray-100 lg:hover:bg-transparent lg:hover:text-blue-700" tabindex="0">
                                <span th:text="#{menu.admin.settings}"></span>
                            </a>
                        </li>
                    </ul>

                    <!--/* Public Navigation (for regular users / visitors) */-->
                    <ul th:unless="${isAdminPage}" class="flex flex-col p-4 font-medium border border-gray-100 rounded-lg bg-gray-50 md:mt-4 xl:space-x-3 rtl:space-x-reverse xl:flex-row xl:mt-0 xl:border-0 xl:bg-white">
                        <li class="text-xs font-bold uppercase">
                            <a th:href="#{menu.libraryRegulations.url}" class="block py-2 px-3 text-gray-900 rounded hover:bg-gray-100 lg:hover:bg-transparent lg:hover:text-blue-700" target="_blank" rel="noopener" tabindex="0">
                                <span th:text="#{menu.libraryRegulations}"></span>
                                <span class="sr-only" th:text="#{a11y.opensInNewWindow}"></span>
                            </a>
                        </li>
                        <li class="text-xs font-bold uppercase">
                            <a th:href="#{menu.pricing.url}" class="block py-2 px-3 text-gray-900 rounded hover:bg-gray-100 lg:hover:bg-transparent lg:hover:text-blue-700" target="_blank" rel="noopener" tabindex="0">
                                <span th:text="#{menu.pricing}"></span>
                                <span class="sr-only" th:text="#{a11y.opensInNewWindow}"></span>
                            </a>
                        </li>
                        <li class="text-xs font-bold uppercase">
                            <a th:href="#{menu.privacyPolicy.url}" class="block py-2 px-3 text-gray-900 rounded hover:bg-gray-100 lg:hover:bg-transparent lg:hover:text-blue-700" target="_blank" rel="noopener" tabindex="0">
                                <span th:text="#{menu.privacyPolicy}"></span>
                                <span class="sr-only" th:text="#{a11y.opensInNewWindow}"></span>
                            </a>
                        </li>
                        <li class="text-xs font-bold uppercase">
                            <a th:href="#{menu.employmentConfirmation.url}" class="block py-2 px-3 text-gray-900 rounded hover:bg-gray-100 lg:hover:bg-transparent lg:hover:text-blue-700" target="_blank" rel="noopener" tabindex="0">
                                <span th:text="#{menu.employmentConfirmation}"></span>
                                <span class="sr-only" th:text="#{a11y.opensInNewWindow}"></span>
                            </a>
                        </li>
                        <li class="text-xs font-bold uppercase">
                            <a th:href="#{menu.registration.url}" class="block py-2 px-3 text-gray-900 rounded hover:bg-gray-100 lg:hover:bg-transparent lg:hover:text-blue-700" target="_blank" rel="noopener" tabindex="0">
                                <span th:text="#{menu.registration}"></span>
                                <span class="sr-only" th:text="#{a11y.opensInNewWindow}"></span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
</body>
</html>
